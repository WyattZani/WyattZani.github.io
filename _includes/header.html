<header class="banner"{% if site.banner_image != "" %} style="background-image: url('{{ site.banner_image | relative_url }}');"{% endif %}>
  <nav class="topnav" aria-label="Sections">
    <a class="topnav-name" href="#">{{ site.username }}</a>
    <div class="topnav-links">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      {% if site.resume_file != "" %}<a href="{{ site.resume_file | relative_url }}">Résumé</a>{% endif %}
    </div>
  </nav>
  <div class="banner-inner">
    <h1 class="banner-name">{{ site.username }}</h1>
    {% if site.user_title != "" %}<p class="banner-title">{{ site.user_title }}</p>{% endif %}
  </div>
  {% if site.banner_credit != "" %}<p class="banner-credit">{{ site.banner_credit }}</p>{% endif %}
</header>
