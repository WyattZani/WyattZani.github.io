- id: mic-array
  title: Sound localization microphone array
  status: In progress
  context: Personal project
  summary: A four-microphone array that finds and follows a person speaking as they move around a room. The localization runs entirely on the board instead of being streamed to a computer.
  details:
    - Four Infineon IM73A135V01 MEMS microphones in a square layout, with the signal chain designed around the frequency range of normal speech.
    - An op-amp preamp for each microphone with a gain of 21, built and working.
    - A TI ADS131M04 four-channel ADC with an ESP32 supplying its clock, so all four microphones are sampled together.
    - C++ firmware on the ESP32 combines the four channels to estimate where the sound is coming from.
    - Schematic drawn in KiCad, split into a preamp page and an ADC page, with design decisions recorded in a running technical report.
  skills:
    - Analog front ends
    - Mixed-signal design
    - KiCad
    - ESP32
    - C++
  image: ""
  image_alt: ""
  link: ""
  link_text: ""

